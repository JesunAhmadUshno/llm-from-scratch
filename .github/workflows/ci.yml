name: ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scaffold smoke test
        run: python tests/test_smoke.py
      - name: install numpy
        run: pip install numpy
      - name: level 1 learn tests
        run: python -m unittest discover -s tests -p "test_learn*.py" -v
      - name: install build frameworks (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install jax
      - name: level 2 build tests
        run: python -m unittest discover -s tests -p "test_build*.py" -v
      - name: level 2 build run
        run: python level-2-build/run_build.py
      - name: level 3 deep tests
        run: python -m unittest discover -s tests -p "test_deep*.py" -v
      - name: level 3 deep run
        run: python level-3-deep/run_deep.py
