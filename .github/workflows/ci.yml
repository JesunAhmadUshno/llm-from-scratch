name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: layout check (required files, no public grade)
        run: python -m unittest tests/test_layout.py -v
      - name: install numpy
        run: pip install numpy
      - name: level 1 learn tests
        run: python -m unittest discover -s tests -p "test_learn*.py" -v
      - name: install build frameworks (CPU)
        run: |
          # Pinned to the versions the recorded 2026-11-04 runs used (level READMEs).
          # jax 0.12.0.1 needs Python 3.12; 3.11 gets 0.10.2, its newest release (docs/decisions/0004).
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install "jax==0.12.0.1; python_version >= '3.12'" "jax==0.10.2; python_version < '3.12'"
      - name: level 2 build tests
        run: python -m unittest discover -s tests -p "test_build*.py" -v
      - name: level 2 build run
        run: python level-2-build/run_build.py
      - name: level 3 deep tests
        run: python -m unittest discover -s tests -p "test_deep*.py" -v
      - name: level 3 deep run
        run: python level-3-deep/run_deep.py
  dashboard-check:
    # README tables must still match the results files they were read from (site/src/check.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: results and README tables agree (known-answer check)
        run: node src/check.mjs
        working-directory: site
